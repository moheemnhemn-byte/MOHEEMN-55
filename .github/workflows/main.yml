name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NAVARA-Studio-v3.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 16
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;24.0.8215888" "platforms;android-33" "build-tools;33.0.0"
      - name: Install JS deps
        working-directory: SAMP-Mobile-Launcher-RN-main
        run: yarn install --frozen-lockfile || yarn install
      - name: Build
        shell: bash
        working-directory: SAMP-Mobile-Launcher-RN-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NAVARA-APK-and-log
          path: |
            SAMP-Mobile-Launcher-RN-main/android/app/build/outputs/apk/debug/*.apk
            SAMP-Mobile-Launcher-RN-main/build.log
